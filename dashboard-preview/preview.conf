# Same-origin-free preview proxies so the dashboard can show the target before deploying.
server { listen 8091; location / { proxy_pass http://juice:3000; proxy_set_header Host $host:8091; proxy_hide_header X-Frame-Options; proxy_hide_header Content-Security-Policy; } }
server { listen 8092; location / { proxy_pass http://dvwa:80; proxy_set_header Host $host:8092; proxy_hide_header X-Frame-Options; proxy_hide_header Content-Security-Policy; } }
