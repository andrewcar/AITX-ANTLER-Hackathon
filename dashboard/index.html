<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VulnSwarm Dashboard</title>
<style>
  :root {
    --bg:#0c0e12; --panel:#14181f; --line:#2c323c; --fg:#f2f4f8; --muted:#a3aab4;
    --accent:#4f8cff; --ok:#5ee08a; --warn:#e8c35a; --rej:#9aa0a6;
    --hi:#ff6b6b; --med:#ffa94d; --low:#ffd43b; --info:#74c0fc;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.45 system-ui,-apple-system,sans-serif; }
  header { padding:16px 22px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; }
  header h1 { font-size:22px; margin:0; font-weight:800; letter-spacing:-.02em; }
  header .sub { color:var(--muted); font-size:14px; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  main { max-width:1500px; margin:0 auto; padding:22px 18px 48px; }
  .command { display:flex; gap:10px; margin:0 0 16px; }
  .command input { flex:1; font-size:20px; padding:12px 14px; }
  .command button { font-size:18px; padding:12px 22px; letter-spacing:.08em; }
  input, button { font:inherit; }
  input { background:var(--panel); border:1px solid var(--line); color:var(--fg);
          border-radius:8px; padding:8px 10px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:8px 14px; font-weight:700; cursor:pointer; }
  button.ghost { background:var(--panel); border:1px solid var(--line); color:var(--fg); }
  button.danger { background:#c92a2a; color:#fff; font-weight:800; letter-spacing:.12em;
                  padding:12px 18px; font-size:18px; }
  button:disabled { opacity:.45; cursor:default; }
  .limits { color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .muted { color:var(--muted); }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card.active-scan { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .card h3 { margin:0 0 2px; font-size:18px; }
  .card .url { color:var(--muted); font-size:13px; word-break:break-all; margin-bottom:10px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px;
          background:#1c2330; color:var(--muted); margin-bottom:8px; }
  .row { display:flex; gap:8px; align-items:center; }
  .summary { display:flex; flex-wrap:wrap; gap:16px 22px; background:var(--panel);
             border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:14px 0; }
  .stat b { font-size:26px; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; margin-top:6px; font-size:16px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; }
  td.evi { color:var(--muted); font-size:14px; font-family:ui-monospace,monospace; word-break:break-word; }
  tr.rejected { opacity:.55; }
  .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
  .v-confirmed { background:#16351f; color:var(--ok); }
  .v-unverified, .v-pending { background:#3a3320; color:var(--warn); }
  .v-rejected { background:#23262d; color:var(--rej); text-decoration:line-through; }
  .sev { font-weight:800; }
  .sev-high, .sev-critical { color:var(--hi); }
  .sev-medium { color:var(--med); }
  .sev-low { color:var(--low); }
  .sev-info { color:var(--info); }
  .src { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 4px; }
  .machines { color:var(--muted); font-size:13px; margin-top:12px; }
  .hidden { display:none; }
  .err { color:var(--hi); }
  a { color:var(--accent); }

  .theater { margin-top:22px; }
  .theater-top { display:flex; align-items:flex-end; gap:16px; margin-bottom:14px; }
  .target-name { font-size:28px; font-weight:800; letter-spacing:-.03em; margin:0; line-height:1.1; overflow-wrap:anywhere; }
  .target-url { color:var(--muted); font-size:14px; word-break:break-all; }
  .live-pill { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:800;
               letter-spacing:.14em; color:var(--hi); }
  .live-dot { width:12px; height:12px; border-radius:50%; background:var(--hi);
              box-shadow:0 0 12px var(--hi); animation:blink 1s infinite; }
  .live-dot.done { background:var(--ok); box-shadow:none; animation:none; }
  .live-dot.bad { background:var(--hi); box-shadow:none; animation:none; }
  .clock { margin-left:auto; font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.04em; }
  .phase-rail { display:flex; gap:8px; list-style:none; padding:0; margin:0 0 14px; }
  .phase-rail li { flex:1; text-align:center; padding:12px 4px; border:1px solid var(--line);
                   border-radius:10px; font-weight:800; letter-spacing:.08em; font-size:15px;
                   color:var(--muted); background:var(--panel); }
  .phase-rail li.active { color:#fff; border-color:var(--accent); background:#1a2744;
                          box-shadow:0 0 24px rgba(79,140,255,.35); }
  .phase-rail li.done { color:var(--ok); border-color:#1f4d34; background:#122218; }
  .hero { min-height:148px; border:1px solid var(--line); border-radius:14px; padding:18px 20px;
          background:var(--panel); margin-bottom:14px; }
  .hero-kicker { font-size:14px; font-weight:800; letter-spacing:.16em; color:var(--accent); }
  .hero-title { font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.15; margin-top:4px; overflow-wrap:anywhere; }
  .hero-sub { margin-top:6px; color:var(--muted); font-size:16px; }
  .hero.tone-high, .hero.tone-critical { background:#2a1418; border-color:#ff6b6b; }
  .hero.tone-high .hero-kicker, .hero.tone-critical .hero-kicker { color:var(--hi); }
  .hero.tone-medium { background:#2a2012; border-color:#ffa94d; }
  .hero.tone-medium .hero-kicker { color:var(--med); }
  .hero.tone-low { background:#2a2612; border-color:#ffd43b; }
  .hero.tone-low .hero-kicker { color:var(--low); }
  .hero.tone-info { background:#12202a; border-color:#74c0fc; }
  .hero.tone-info .hero-kicker { color:var(--info); }
  .hero.tone-phase { background:#141a28; border-color:#4f8cff; }
  .hero.tone-ok { background:#122218; border-color:#5ee08a; }
  .hero.tone-ok .hero-kicker { color:var(--ok); }
  .hero.tone-bad { background:#2a1216; border-color:#ff6b6b; }
  .hero.tone-bad .hero-kicker { color:var(--hi); }
  .lanes { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  .lane { background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--lane, var(--line));
          border-radius:12px; padding:12px 14px; min-height:118px; }
  .lane.running { background:#171c28; box-shadow:0 0 0 1px rgba(79,140,255,.35); }
  .lane-wait { color:var(--muted); display:flex; align-items:center; border-left-color:var(--line); }
  .lane-top { display:flex; align-items:baseline; gap:8px; }
  .lane-name { font-size:20px; font-weight:800; letter-spacing:-.02em; }
  .lane-count { margin-left:auto; font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .lane-status { color:var(--muted); font-size:14px; margin-top:2px; min-height:1.2em; }
  .lane.running .lane-status { color:var(--accent); font-weight:700; }
  .lane-label { font-family:ui-monospace,monospace; font-size:13px; color:var(--fg); min-height:1.2em; margin-top:4px; }
  .ticks { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; min-height:14px; }
  .tick { width:12px; height:12px; border-radius:2px; background:#2a2e36; display:inline-block; }
  .tick.running { background:var(--accent); animation:blink .8s infinite; }
  .tick.done { background:#3d4654; }
  .tick.hit.sev-high, .tick.hit.sev-critical { background:var(--hi); }
  .tick.hit.sev-medium { background:var(--med); }
  .tick.hit.sev-low { background:var(--low); }
  .tick.hit.sev-info { background:var(--info); }
  .tick.hit { background:var(--hi); }
  .feed-head { display:flex; align-items:baseline; gap:10px; margin:4px 0 8px; }
  .feed-head h3 { margin:0; font-size:18px; }
  .feed-head b { font-size:22px; font-variant-numeric:tabular-nums; }
  .feed { display:flex; flex-direction:column; gap:8px; max-height:min(440px, 42vh); overflow:auto; padding-right:4px; }
  .feed-empty { color:var(--muted); padding:8px 2px 16px; }
  .finding { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--line);
             border-radius:12px; padding:12px 14px; animation:rise .35s ease; }
  .finding.sev-high, .finding.sev-critical { border-left-color:var(--hi); }
  .finding.sev-medium { border-left-color:var(--med); }
  .finding.sev-low { border-left-color:var(--low); }
  .finding.sev-info { border-left-color:var(--info); }
  .finding-top { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .finding-who { margin-left:auto; color:var(--muted); font-size:14px; }
  .finding-title { font-size:22px; font-weight:800; letter-spacing:-.02em; margin-top:4px; line-height:1.2; overflow-wrap:anywhere; }
  .finding-evi, .finding-fix { color:var(--muted); font-size:15px; margin-top:2px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .sev-tag { font-size:13px; font-weight:800; letter-spacing:.08em; padding:3px 8px; border-radius:4px; background:#1c2330; }
  .dedupe { color:var(--muted); margin-top:10px; }
  .report { margin-top:18px; }
  .report:empty { display:none; }
  .report h2 { font-size:20px; margin:0; }
  .swarm-stage { position:relative; height:min(68vh, 720px); min-height:480px; margin:0 0 14px;
                 border-radius:18px; overflow:hidden; border:1px solid var(--line);
                 background:
                   radial-gradient(ellipse at center, rgba(79,140,255,.18), transparent 58%),
                   linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
                   #0c0e12;
                 background-size: auto, 56px 56px, 56px 56px, auto; }
  .swarm-stage canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:3; }
  .site-wrap { position:absolute; left:50%; top:46%; width:min(920px, 92%); height:min(540px, 80%);
               transform:translate(-50%, -42%) scale(1); transform-origin:center center;
               transition:transform 1.15s cubic-bezier(.62,.02,.18,1); z-index:2; }
  .site-wrap.docked { transform:translate(-50%, -50%) scale(.2); }
  .site-wrap.hit { animation:siteHit .5s ease; }
  .browser { width:100%; height:100%; background:#f4f6f8; color:#16181d; border-radius:14px;
             overflow:hidden; display:flex; flex-direction:column;
             box-shadow:0 28px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.12); }
  .browser-bar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:#e6ebf1;
                 color:#2c3340; font-size:14px; font-weight:700; }
  .browser-dots { display:flex; gap:5px; }
  .browser-dots i { width:10px; height:10px; border-radius:50%; background:#c5ccd6; display:block; }
  .browser-dots i:first-child { background:#ff6b6b; }
  .browser-url { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:ui-monospace,monospace; font-weight:600; }
  .browser-kind { letter-spacing:.12em; font-size:11px; color:#5c6778; }
  .browser-body { position:relative; flex:1; min-height:0; background:#f7f8fa; }
  .site-frame, .site-mock { position:absolute; inset:0; width:100%; height:100%; border:0; background:#f7f8fa; }
  .mock-hero { min-height:38%; padding:28px 28px 18px; color:#fff; display:flex; flex-direction:column; justify-content:flex-end; }
  .mock-title { font-size:42px; font-weight:800; letter-spacing:-.03em; line-height:1.05; }
  .mock-sub { margin-top:6px; font-size:16px; opacity:.85; font-family:ui-monospace,monospace; }
  .mock-nav { display:flex; gap:18px; padding:12px 28px; background:#fff; color:#3c4452; font-weight:700; border-bottom:1px solid #e4e8ee; }
  .mock-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; padding:18px 28px; }
  .mock-card { background:#fff; border-radius:10px; min-height:72px; padding:14px; box-shadow:0 1px 0 rgba(0,0,0,.04); }
  .mock-card i { display:block; height:10px; border-radius:6px; background:#d5dbe3; margin-bottom:8px; }
  .mock-card i:last-child { width:62%; margin-bottom:0; }
  .stage-stamp { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center;
                 background:rgba(8,10,14,.45); color:#ff6b6b; font-size:84px; font-weight:800; letter-spacing:.14em;
                 text-shadow:0 10px 40px rgba(0,0,0,.65); pointer-events:none; }
  .swarm-readout { position:absolute; left:18px; bottom:14px; z-index:4; pointer-events:none; }
  .swarm-readout b { display:block; font-size:72px; font-weight:800; letter-spacing:-.04em; line-height:.85;
                     font-variant-numeric:tabular-nums; }
  .swarm-readout span { letter-spacing:.16em; font-size:13px; font-weight:800; color:var(--muted); }
  .hit-banner { position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:4; max-width:88%;
                font-size:28px; font-weight:800; letter-spacing:-.02em; text-align:center; pointer-events:none;
                text-shadow:0 2px 16px rgba(0,0,0,.85); opacity:0; }
  .hit-banner.show { animation:hitIn 1.6s ease; }
  @keyframes siteHit {
    0% { filter:drop-shadow(0 0 0 var(--hit, var(--hi))); }
    35% { filter:drop-shadow(0 0 22px var(--hit, var(--hi))); }
    100% { filter:none; }
  }
  @keyframes hitIn {
    0% { opacity:0; transform:translateX(-50%) translateY(-8px); }
    12% { opacity:1; transform:translateX(-50%) translateY(0); }
    75% { opacity:1; }
    100% { opacity:0; }
  }
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; align-items:start; }
  .activity { position:sticky; top:12px; background:var(--panel); border:1px solid var(--line);
              border-radius:12px; padding:12px 14px 8px; max-height:calc(100vh - 24px);
              display:flex; flex-direction:column; }
  .activity h3 { margin:0; font-size:18px; letter-spacing:.04em; }
  .activity-head { display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  .activity-list { overflow:auto; display:flex; flex-direction:column; gap:2px; }
  .act { font-size:15px; border-bottom:1px solid var(--line); padding:7px 2px; }
  .act time { color:var(--muted); font-variant-numeric:tabular-nums; font-size:13px; }
  .act .who { font-weight:800; }
  .act .url { color:var(--muted); font-family:ui-monospace,monospace; font-size:13px; word-break:break-all; }
  .st-ok { color:var(--ok); font-weight:800; }
  .st-bad { color:var(--hi); font-weight:800; }
  .st-warn { color:var(--warn); font-weight:800; }
  @keyframes rise { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:none; } }
  @keyframes blink { 50% { opacity:.35; } }
  @media (max-width:900px) {
    .lanes { grid-template-columns:1fr; }
    .phase-rail { flex-wrap:wrap; }
    .phase-rail li { flex:1 1 30%; }
    .hero-title, .target-name { font-size:26px; }
    .clock { font-size:24px; }
    .stage { grid-template-columns:1fr; }
    .activity { position:static; max-height:360px; }
    .swarm-stage { height:520px; }
    .stage-stamp { font-size:48px; }
    .swarm-readout b { font-size:48px; }
    .mock-title { font-size:28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .tick.running, .finding, .site-wrap, .hit-banner.show { animation:none; transition:none; }
  }
</style>
</head>
<body>
<header>
  <h1>VulnSwarm</h1><span class="sub">live swarm</span>
  <div class="right">
    <input id="api" style="width:220px" aria-label="Backend URL" />
    <span id="limits" class="limits hidden"></span>
    <span id="who" class="muted"></span>
    <button id="stopAll" class="danger hidden" type="button">STOP ALL</button>
    <button id="logout" class="ghost hidden" type="button">logout</button>
  </div>
</header>
<main>
  <section id="loginView" class="card" style="max-width:380px;margin-top:10px">
    <h3>Sign in</h3>
    <div class="muted" style="margin-bottom:8px">Connect to the swarm backend.</div>
    <div class="row" style="margin-bottom:8px"><input id="email" value="erwin@local" placeholder="email" style="flex:1"/></div>
    <div class="row" style="margin-bottom:10px"><input id="password" type="password" value="demo" placeholder="password" style="flex:1"/></div>
    <button id="loginBtn" type="button">Sign in</button>
    <div id="loginMsg" class="err"></div>
  </section>

  <section id="appView" class="hidden">
    <div class="stage">
      <div>
        <form id="scanForm" class="command">
          <input id="targetUrl" aria-label="Target URL" placeholder="Target URL — http://127.0.0.1/lab" autocomplete="off" />
          <button type="submit">SCAN</button>
        </form>
        <div class="row" style="justify-content:space-between;margin-bottom:10px">
          <h2 style="font-size:18px;margin:0">Targets</h2>
          <button id="scanAll" class="ghost" type="button">Scan all</button>
        </div>
        <div id="cards" class="cards"></div>
        <div id="result"></div>
      </div>
      <aside id="activity" class="activity" aria-live="polite">
        <div class="activity-head">
          <h3>Activity</h3>
          <span class="muted" style="font-size:13px">audit log</span>
        </div>
        <div id="activityList" class="activity-list"></div>
      </aside>
    </div>
  </section>
</main>
<script>
const DEFAULT_API = "http://10.0.0.32:8000";
const PHASES = ["AUTH", "MAP", "PLAN", "SWARM", "VERIFY", "REPORT"];
const PHASE_COPY = {
  AUTH: ["Authenticating", "Logging in when this lab target has a known recipe"],
  MAP: ["Mapping the surface", "Pages, forms, and parameters"],
  PLAN: ["Planning the swarm", "Pairing each section with a specialist"],
  SWARM: ["Swarm is running", "Specialists working in parallel"],
  VERIFY: ["Verifying findings", "Checking each one against a fresh observation"],
  REPORT: ["Writing the report", "Deduping, ranking, summarizing"],
};
const AGENT_COLOR = {
  config_headers: "#74c0fc",
  exposed_paths: "#ffa94d",
  injection: "#ff6b6b",
};
const SEVS = ["critical", "high", "medium", "low", "info"];
const PACE_MS = { finding: 420, verdict: 100, agent: 90, phase: 140, scan_started: 80 };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sevOf = (s) => { s = String(s || "info").toLowerCase(); return SEVS.includes(s) ? s : "info"; };

const store = {
  get token(){ try { return localStorage.getItem("vs_token"); } catch { return null; } },
  set token(v){ try { v ? localStorage.setItem("vs_token", v) : localStorage.removeItem("vs_token"); } catch {} },
  get api(){ try { return localStorage.getItem("vs_api") || DEFAULT_API; } catch { return DEFAULT_API; } },
  set api(v){ try { localStorage.setItem("vs_api", v); } catch {} },
};

let scanGen = 0;
let activeScan = null;
let session = null;
let clockTimer = null;
let auditTimer = null;

async function api(path, opts={}) {
  const res = await fetch(store.api + path, {
    ...opts,
    headers: { "Content-Type":"application/json",
               ...(store.token ? {Authorization: "Bearer " + store.token} : {}), ...(opts.headers || {}) },
  });
  return res;
}

async function login() {
  $("loginMsg").textContent = "";
  store.api = $("api").value.trim() || DEFAULT_API;
  try {
    const res = await api("/auth/login", { method:"POST",
      body: JSON.stringify({ email:$("email").value, password:$("password").value }) });
    if (!res.ok) { $("loginMsg").textContent = "Login failed (" + res.status + ")"; return; }
    const d = await res.json();
    store.token = d.token;
    enterApp(d.email);
  } catch { $("loginMsg").textContent = "Cannot reach backend at " + store.api; }
}

function enterApp(email) {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("logout").classList.remove("hidden");
  $("who").textContent = email || "";
  loadTargets();
  startAudit();
}

async function loadTargets() {
  const res = await api("/targets");
  if (res.status === 401) return doLogout();
  const { targets } = await res.json();
  $("cards").innerHTML = targets.map(t => `
    <div class="card">
      <div class="pill">${esc(t.stack || "")}</div>
      <h3>${esc(t.name)}</h3>
      <div class="url">${esc(t.url)}</div>
      <button type="button" data-url="${esc(t.url)}" data-name="${esc(t.name)}">Scan</button>
    </div>`).join("");
  $("cards").querySelectorAll("button[data-url]").forEach(b =>
    b.addEventListener("click", () => {
      const input = $("targetUrl");
      if (input) input.value = b.dataset.url;
      scan(b.dataset.url, b.dataset.name);
    }));
  window._targets = targets;
}

function markActive(url) {
  document.querySelectorAll("#cards .card").forEach(card => {
    const btn = card.querySelector("button[data-url]");
    const on = !!(btn && btn.dataset.url === url);
    card.classList.toggle("active-scan", on);
    if (btn) btn.textContent = on ? "Live" : "Scan";
  });
}
function clearActive() {
  document.querySelectorAll("#cards .card").forEach(card => {
    card.classList.remove("active-scan");
    const btn = card.querySelector("button[data-url]");
    if (btn) btn.textContent = "Scan";
  });
}

function hostOf(url) {
  try { return new URL(url).host || url; } catch { return url; }
}

function hueOf(text) {
  let h = 0;
  for (const ch of String(text || "")) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  return h % 360;
}

function paintMock(url, info) {
  const mock = $("siteMock");
  if (!mock) return;
  mock.classList.remove("hidden");
  mock.replaceChildren();
  const hue = hueOf(url);
  const hero = document.createElement("div");
  hero.className = "mock-hero";
  hero.style.background = "linear-gradient(145deg, hsl(" + hue + " 58% 38%), hsl(" + ((hue + 36) % 360) + " 46% 22%))";
  const title = document.createElement("div");
  title.className = "mock-title";
  title.textContent = (info && info.title) || hostOf(url);
  const sub = document.createElement("div");
  sub.className = "mock-sub";
  sub.textContent = url;
  hero.append(title, sub);
  const nav = document.createElement("div");
  nav.className = "mock-nav";
  ["Overview", "Login", "Search", "Account"].forEach(label => {
    const span = document.createElement("span");
    span.textContent = label;
    nav.appendChild(span);
  });
  const grid = document.createElement("div");
  grid.className = "mock-grid";
  for (let i = 0; i < 6; i++) {
    const card = document.createElement("div");
    card.className = "mock-card";
    const a = document.createElement("i");
    a.style.width = (46 + ((hue + i * 19) % 44)) + "%";
    const b = document.createElement("i");
    card.append(a, b);
    grid.appendChild(card);
  }
  mock.append(hero, nav, grid);
  const urlEl = $("siteUrl");
  if (urlEl) urlEl.textContent = url;
  const kind = $("siteKind");
  if (kind) {
    if (info && info.allowlisted === false) kind.textContent = "NOT IN SCOPE";
    else if (info && info.mode === "iframe") kind.textContent = "LIVE PAGE";
    else kind.textContent = "PREVIEW";
  }
}

function watchFrame(frame) {
  let ok = false;
  try {
    const href = frame.contentWindow && frame.contentWindow.location.href;
    ok = !!(href && href !== "about:blank");
  } catch {
    ok = true;
  }
  if (!ok) {
    frame.classList.add("hidden");
    frame.removeAttribute("src");
    return;
  }
  frame.classList.remove("hidden");
  const mock = $("siteMock");
  if (mock) mock.classList.add("hidden");
}

async function loadPreview(url) {
  paintMock(url, { title: hostOf(url) });
  let info = null;
  try {
    const res = await api("/preview?url=" + encodeURIComponent(url));
    if (res.ok) info = await res.json();
  } catch {}
  if (!info || !$("siteMock")) return;
  paintMock(url, info);
  const frame = $("siteFrame");
  if (!frame || info.mode !== "iframe" || !info.allowlisted) {
    if (frame) {
      frame.classList.add("hidden");
      frame.removeAttribute("src");
    }
    return;
  }
  frame.classList.add("hidden");
  frame.onload = () => watchFrame(frame);
  frame.src = info.url || url;
}

function stageStamp(word) {
  const el = $("stageStamp");
  if (!el) return;
  if (!word) {
    el.textContent = "";
    el.classList.add("hidden");
    return;
  }
  el.textContent = word;
  el.classList.remove("hidden");
}

function flashFinding(ev) {
  const banner = $("hitBanner");
  const sev = sevOf(ev.severity);
  if (banner) {
    banner.className = "hit-banner sev-" + sev;
    banner.textContent = sev.toUpperCase() + "  ·  " + (ev.title || "Finding");
    void banner.offsetWidth;
    banner.classList.add("show");
  }
  const wrap = $("siteWrap");
  if (!wrap) return;
  const color = { critical: "#ff6b6b", high: "#ff6b6b", medium: "#ffa94d", low: "#ffd43b", info: "#74c0fc" }[sev] || "#ff6b6b";
  wrap.style.setProperty("--hit", color);
  wrap.classList.remove("hit");
  void wrap.offsetWidth;
  wrap.classList.add("hit");
}

const MAX_DRONES = 64;
const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function createSwarm(canvas, stage) {
  const drones = [];
  const sparks = [];
  let realUnits = 0;
  let released = false;
  let alive = true;
  let raf = 0;
  let cssW = 1;
  let cssH = 1;
  const ctx = canvas.getContext("2d");

  function resize() {
    const rect = stage.getBoundingClientRect();
    cssW = Math.max(1, rect.width);
    cssH = Math.max(1, rect.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(cssW * dpr);
    canvas.height = Math.floor(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function edgePoint(i) {
    const side = i % 4;
    const j = (i * 47) % 100 / 100;
    if (side === 0) return { x: -36, y: 24 + j * (cssH - 48) };
    if (side === 1) return { x: cssW + 36, y: 24 + j * (cssH - 48) };
    if (side === 2) return { x: 24 + j * (cssW - 48), y: -36 };
    return { x: 24 + j * (cssW - 48), y: cssH + 36 };
  }

  function paintCount() {
    const count = $("swarmCount");
    const note = $("swarmNote");
    if (!count) return;
    const shown = drones.length;
    const real = Math.max(shown, realUnits);
    count.textContent = String(real);
    if (note) {
      note.textContent = shown < real
        ? shown + " shown · " + real + " units"
        : "agents in the swarm";
    }
  }

  function spawn(name) {
    if (drones.length >= MAX_DRONES) return null;
    const at = edgePoint(drones.length);
    const drone = {
      name: name || "agent",
      unitId: "",
      color: AGENT_COLOR[name] || "#4f8cff",
      x: at.x, y: at.y,
      sx: at.x, sy: at.y,
      tx: at.x, ty: at.y,
      state: "hold",
      born: 0,
      dur: 900,
      ang: Math.random() * Math.PI * 2,
      spin: 0.007 + (drones.length % 5) * 0.0015,
      rad: 118 + (drones.length % 5) * 16,
      trail: [],
      angle: 0,
    };
    drones.push(drone);
    paintCount();
    return drone;
  }

  function assignOrbit(drone, index) {
    const n = Math.max(drones.length, 6);
    drone.ang = (index / n) * Math.PI * 2 - Math.PI / 2;
    drone.rad = 124 + (index % 4) * 18;
  }

  function fly(drone, index) {
    assignOrbit(drone, index);
    const cx = cssW / 2;
    const cy = cssH / 2;
    drone.sx = drone.x;
    drone.sy = drone.y;
    drone.tx = cx + Math.cos(drone.ang) * drone.rad;
    drone.ty = cy + Math.sin(drone.ang) * drone.rad * 0.9;
    drone.born = performance.now() + index * (REDUCE_MOTION ? 0 : 42);
    drone.dur = REDUCE_MOTION ? 1 : 880;
    drone.state = "fly";
  }

  function release() {
    if (released) return;
    released = true;
    resize();
    drones.forEach((drone, i) => {
      if (drone.state === "hold" || drone.state === "fly") fly(drone, i);
    });
  }

  function seed(names) {
    const list = names && names.length ? names : ["config_headers", "exposed_paths", "injection"];
    list.forEach(name => {
      if (!drones.some(d => d.name === name)) spawn(name);
    });
    if (released) drones.forEach((drone, i) => { if (drone.state === "hold") fly(drone, i); });
  }

  function multiply(byAgent) {
    const planned = byAgent || {};
    let total = 0;
    Object.keys(planned).forEach(name => {
      const want = Math.max(0, Number(planned[name]) || 0);
      total += want;
      const have = drones.filter(d => d.name === name).length;
      const room = MAX_DRONES - drones.length;
      const add = Math.min(Math.max(0, want - have), room);
      for (let i = 0; i < add; i++) spawn(name);
    });
    realUnits = Math.max(realUnits, total);
    paintCount();
    if (released) drones.forEach((drone, i) => { if (drone.state === "hold") fly(drone, i); });
  }

  function launch(ev) {
    const name = ev.agent || "agent";
    let drone = ev.unit_id && drones.find(d => d.unitId === ev.unit_id);
    if (!drone) drone = drones.find(d => d.name === name && !d.unitId);
    if (!drone) drone = spawn(name);
    if (!drone) {
      realUnits = Math.max(realUnits, drones.length + 1);
      paintCount();
      return;
    }
    if (ev.unit_id) drone.unitId = ev.unit_id;
    if (released && drone.state === "hold") fly(drone, drones.indexOf(drone));
  }

  function strike(ev) {
    const name = ev.agent || "";
    const drone = (ev.unit_id && drones.find(d => d.unitId === ev.unit_id))
      || drones.find(d => d.name === name)
      || drones[0];
    const sev = sevOf(ev.severity);
    const color = { critical: "#ff6b6b", high: "#ff6b6b", medium: "#ffa94d", low: "#ffd43b", info: "#74c0fc" }[sev] || "#ff6b6b";
    if (drone) {
      drone.color = color;
      drone.strike = performance.now();
      sparks.push({
        x: cssW / 2, y: cssH / 2, color, born: performance.now(),
        vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
      });
      for (let i = 0; i < 10; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1.5 + Math.random() * 4.5;
        sparks.push({
          x: cssW / 2, y: cssH / 2, color, born: performance.now(),
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        });
      }
    }
    if (sparks.length > 96) sparks.splice(0, sparks.length - 96);
    flashFinding(ev);
  }

  function settle() {
    released = true;
    drones.forEach(d => { if (d.state !== "done") d.state = "done"; });
  }

  function drawDrone(drone) {
    ctx.save();
    ctx.translate(drone.x, drone.y);
    ctx.rotate(drone.angle);
    ctx.fillStyle = drone.color;
    ctx.shadowColor = drone.color;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-11, 7);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-11, -7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    if (!alive || !canvas.isConnected) { alive = false; return; }
    const cx = cssW / 2;
    const cy = cssH / 2;
    ctx.clearRect(0, 0, cssW, cssH);
    if (released) {
      ctx.save();
      ctx.strokeStyle = "rgba(79,140,255,.45)";
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 14]);
      ctx.lineDashOffset = -now / 35;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 108, 96, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    for (let i = 0; i < drones.length; i++) {
      const drone = drones[i];
      if (!released || drone.state === "hold") continue;
      if (drone.state === "fly") {
        const t = Math.min(1, Math.max(0, (now - drone.born) / drone.dur));
        const e = 1 - Math.pow(1 - t, 3);
        drone.x = drone.sx + (drone.tx - drone.sx) * e;
        drone.y = drone.sy + (drone.ty - drone.sy) * e;
        if (t >= 1) drone.state = "orbit";
      } else if (drone.state === "orbit" || drone.state === "done") {
        drone.ang += drone.state === "done" ? drone.spin * 0.35 : drone.spin;
        const pull = drone.strike && now - drone.strike < 280 ? (1 - (now - drone.strike) / 280) : 0;
        const rad = drone.rad * (1 - pull * 0.72);
        drone.x = cx + Math.cos(drone.ang) * rad;
        drone.y = cy + Math.sin(drone.ang) * rad * 0.9;
      }
      drone.angle = Math.atan2(cy - drone.y, cx - drone.x);
      drone.trail.push({ x: drone.x, y: drone.y });
      if (drone.trail.length > 10) drone.trail.shift();
      ctx.beginPath();
      drone.trail.forEach((p, pi) => {
        if (pi === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      });
      ctx.strokeStyle = drone.color;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (drone.strike && now - drone.strike < 520) {
        const fade = 1 - (now - drone.strike) / 520;
        ctx.globalAlpha = fade;
        ctx.strokeStyle = drone.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(drone.x, drone.y);
        ctx.lineTo(cx, cy);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      drawDrone(drone);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const spark = sparks[i];
      const age = now - spark.born;
      if (age > 700) { sparks.splice(i, 1); continue; }
      spark.x += spark.vx;
      spark.y += spark.vy;
      ctx.globalAlpha = 1 - age / 700;
      ctx.fillStyle = spark.color;
      ctx.beginPath();
      ctx.arc(spark.x, spark.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    raf = requestAnimationFrame(frame);
  }

  function start() {
    resize();
    window.addEventListener("resize", resize);
    raf = requestAnimationFrame(frame);
  }

  function stop() {
    alive = false;
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", resize);
  }

  return { start, stop, seed, multiply, launch, strike, settle, release };
}

function noteSwarm(sess, ev) {
  const swarm = sess.swarm;
  if (!swarm || !ev) return;
  if (ev.type === "scan_started") swarm.seed(ev.agents || []);
  else if (ev.type === "phase" && ev.phase === "PLAN" && ev.status === "finished") swarm.multiply((ev.detail && ev.detail.by_agent) || {});
  else if (ev.type === "agent" && ev.status === "started") swarm.launch(ev);
  else if (ev.type === "agent" && ev.status === "finished") swarm.launch(ev);
  else if (ev.type === "finding") swarm.strike(ev);
  else if (ev.type === "scan_complete" || ev.type === "error") swarm.settle();
}

function beginDock(sess) {
  const wrap = $("siteWrap");
  if (!wrap || wrap.dataset.docked === "1") return;
  wrap.dataset.docked = "1";
  const go = () => {
    if (sess !== session || !sess.swarm) return;
    sess.swarm.release();
  };
  if (REDUCE_MOTION) {
    wrap.classList.add("docked");
    go();
    return;
  }
  requestAnimationFrame(() => wrap.classList.add("docked"));
  wrap.addEventListener("transitionend", go, { once: true });
  sess.dockBackup = setTimeout(go, 1400);
}

        <button id="stopBtn" class="danger" type="button">STOP</button>

              <span class="browser-dots" aria-hidden="true"><i></i><i></i><i></i></span>

              <span id="siteKind" class="browser-kind">PREVIEW</span>
            </div>
            <div class="browser-body">

}

function startClock() {
  stopClock();
  const t0 = Date.now();
  const tick = () => {
    const el = $("clock");
    if (!el) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    el.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  };
  tick();
  clockTimer = setInterval(tick, 250);
}
function stopClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = null;
}

function setHero(kicker, title, sub, tone) {
  const hero = $("hero");
  if (!hero) return;
  hero.className = "hero" + (tone ? " tone-" + tone : "");
  $("heroKicker").textContent = kicker || "";
  $("heroTitle").textContent = title || "";
  $("heroSub").textContent = sub || "";
}

function setLive(word, kind) {
  const dot = $("liveDot");
  const label = $("liveWord");
  if (label) label.textContent = word;
  if (!dot) return;
  dot.classList.remove("done", "bad");
  if (kind) dot.classList.add(kind);
}

function ensureLane(sess, name) {
  if (!name) name = "agent";
  if (sess.lanes[name]) return sess.lanes[name];
  const host = $("lanes");
  const wait = host && host.querySelector(".lane-wait");
  if (wait) wait.remove();
  const el = document.createElement("section");
  el.className = "lane";
  el.style.setProperty("--lane", AGENT_COLOR[name] || "#4f8cff");
  el.innerHTML = `
    <div class="lane-top"><span class="lane-name"></span><span class="lane-count">0</span></div>
    <div class="lane-status">standing by</div>
    <div class="lane-label"></div>
    <div class="ticks"></div>`;
  el.querySelector(".lane-name").textContent = name;
  host.appendChild(el);
  const lane = { running: 0, done: 0, findings: 0, expected: null, el, ticks: {} };
  sess.lanes[name] = lane;
  return lane;
}

function paintLane(lane) {
  const status = lane.el.querySelector(".lane-status");
  const count = lane.el.querySelector(".lane-count");
  count.textContent = String(lane.findings);
  if (lane.running > 0) {
    lane.el.classList.add("running");
    const of = lane.expected ? ` / ${lane.expected}` : "";
    status.textContent = `${lane.running} running · ${lane.done}${of} done`;
  } else {
    lane.el.classList.remove("running");
    if (lane.expected === 0) status.textContent = "not scheduled";
    else if (lane.done > 0) status.textContent = `done · ${lane.findings} finding${lane.findings === 1 ? "" : "s"}`;
    else status.textContent = "standing by";
  }
}

function apply(sess, ev) {
  if (!ev || sess.closed || sess.gen !== scanGen) return;
  noteSwarm(sess, ev);
  const type = ev.type;
  if (type === "scan_started") {
    if (ev.run_id) sess.runId = ev.run_id;
    setLive("LIVE");
    setHero("LIVE", "Scan started", ev.run_id || "", "phase");
    (ev.agents || []).forEach(name => ensureLane(sess, name));
    refreshAudit();
    return;
  }
  if (type === "phase") {
    if (!PHASES.includes(ev.phase)) return;
    const li = document.querySelector(`.phase-rail li[data-phase="${ev.phase}"]`);
    if (ev.status === "started") {
      document.querySelectorAll(".phase-rail li.active").forEach(n => n.classList.remove("active"));
      if (li) { li.classList.add("active"); li.classList.remove("done"); }
      const copy = PHASE_COPY[ev.phase] || [ev.phase, ""];
      setHero(ev.phase, copy[0], copy[1], "phase");
    } else if (ev.status === "finished") {
      if (li) { li.classList.remove("active"); li.classList.add("done"); }
      const detail = phaseDetail(ev.phase, ev.detail);
      if (detail) $("heroSub").textContent = detail;
      if (ev.phase === "PLAN" && ev.detail && ev.detail.by_agent) {
        const planned = ev.detail.by_agent;
        Object.keys(sess.lanes).forEach(name => {
          sess.lanes[name].expected = Object.prototype.hasOwnProperty.call(planned, name) ? planned[name] : 0;
          paintLane(sess.lanes[name]);
        });
        Object.keys(planned).forEach(name => ensureLane(sess, name));
        Object.entries(planned).forEach(([name, n]) => {
          sess.lanes[name].expected = n;
          paintLane(sess.lanes[name]);
        });
      }
    }
    return;
  }
  if (type === "agent") {
    const lane = ensureLane(sess, ev.agent);
    const label = ev.label || (ev.section && (ev.section.param || ev.section.kind)) || "";
    if (ev.status === "started") {
      lane.running++;
      const tick = document.createElement("i");
      tick.className = "tick running";
      tick.title = label;
      lane.el.querySelector(".ticks").appendChild(tick);
      if (ev.unit_id) lane.ticks[ev.unit_id] = tick;
      if (label) lane.el.querySelector(".lane-label").textContent = label;
    } else if (ev.status === "finished") {
      lane.running = Math.max(0, lane.running - 1);
      lane.done++;
      const tick = ev.unit_id ? lane.ticks[ev.unit_id] : null;
      if (tick) tick.classList.remove("running");
      if (!Number(ev.findings)) {
        if (tick) tick.classList.add("done");
      }
      lane.el.querySelector(".lane-label").textContent = label ? `${label} · done` : "done";
    }
    paintLane(lane);
    return;
  }
  if (type === "finding") {
    sess.rawCount++;
    const count = $("foundCount");
    if (count) count.textContent = String(sess.rawCount);
    const sev = sevOf(ev.severity);
    const lane = ensureLane(sess, ev.agent);
    lane.findings++;
    const tick = ev.unit_id ? lane.ticks[ev.unit_id] : null;
    if (tick) tick.classList.add("hit", "sev-" + sev);
    paintLane(lane);
    const empty = $("feedEmpty");
    if (empty) empty.remove();
    const card = document.createElement("article");
    card.className = "finding sev-" + sev;
    if (ev.stream_id != null) card.dataset.streamId = String(ev.stream_id);
    const who = [ev.agent, ev.section].filter(Boolean).join(" · ");
    card.innerHTML = `
      <div class="finding-top">
        <span class="sev-tag sev-${sev}">${esc(sev.toUpperCase())}</span>
        <span class="badge v-pending">pending</span>
        <span class="finding-who">${esc(who)}</span>
      </div>
      <div class="finding-title">${esc(ev.title || "Finding")}</div>
      <div class="finding-evi">${esc(ev.evidence || "")}</div>
      ${ev.fix ? `<div class="finding-fix"><em>Fix:</em> ${esc(ev.fix)}</div>` : ""}`;
    $("feed").prepend(card);
    const sub = [who, ev.layer].filter(Boolean).join(" · ");
    setHero(sev.toUpperCase(), ev.title || "Finding", sub, sev);
    sess.heroStreamId = ev.stream_id;
    return;
  }
  if (type === "verdict") {
    const id = ev.stream_id;
    if (id == null || !/^\d+$/.test(String(id))) return;
    const card = document.querySelector(`.finding[data-stream-id="${id}"]`);
    if (!card) return;
    const badge = card.querySelector(".badge");
    const verdict = String(ev.verdict || "unverified");
    badge.className = "badge v-" + (["confirmed","unverified","rejected"].includes(verdict) ? verdict : "unverified");
    badge.textContent = verdict;
    if (sess.heroStreamId === id || String(sess.heroStreamId) === String(id)) {
      $("heroSub").textContent = verdict + (ev.verify_note ? " — " + ev.verify_note : "");
    }
    return;
  }
  if (type === "scan_complete") {
    sess.sawTerminal = true;
    finishScan(sess, ev);
    return;
  }
  if (type === "error") {
    sess.sawTerminal = true;
    setLive("STOPPED", "bad");
    setHero("ERROR", ev.message || "Scan failed", "", "bad");
  }
}

function phaseDetail(phase, detail) {
  if (!detail) return "";
  if (phase === "AUTH") return detail.note || (detail.authenticated ? "Authenticated" : "Anonymous");
  if (phase === "MAP") return `${detail.pages || 0} pages · ${detail.forms || 0} forms · ${detail.params || 0} params`;
  if (phase === "PLAN") return `${detail.units || 0} work units`;
  if (phase === "SWARM") return `${detail.findings || 0} raw findings`;
  if (phase === "VERIFY") {
    return `${detail.confirmed || 0} confirmed · ${detail.unverified || 0} unverified · ${detail.rejected || 0} rejected`;
  }
  if (phase === "REPORT" && detail.total != null) return `${detail.total} in the report`;
  return "";
}

function finishScan(sess, ev) {
  const stop = $("stopBtn");
  if (stop) stop.disabled = true;
  if (ev.status === "cancelled") {
    setLive("STOPPED", "bad");
    setHero("STOPPED", "Scan stopped", "Later phases did not run.", "bad");
    return;
  }
  setLive("DONE", "done");
  document.querySelectorAll(".phase-rail li").forEach(li => {
    li.classList.remove("active");
    li.classList.add("done");
  });
  const summary = ev.summary || {};
  const total = summary.total ?? 0;
  setHero("COMPLETE", `${total} in the report`, `${summary.confirmed ?? 0} confirmed · ${summary.unverified ?? 0} unverified · ${summary.rejected ?? 0} rejected`, "ok");
  const raw = sess.rawCount || 0;
  if (raw !== total) {
    const note = $("dedupe");
    if (note) note.textContent = `Report kept ${total} after deduping ${raw} raw finding${raw === 1 ? "" : "s"}.`;
  }
  const name = document.querySelector(".target-name");
  renderResult(name ? name.textContent : ev.target, ev, $("report"));
}

function enqueue(sess, ev) {
  sess.pending.push(ev);
  if (sess.pumping) return;
  sess.pumping = true;
  sess.drain = (async () => {
    try {
      while (sess.pending.length) {
        if (sess.closed || sess.gen !== scanGen) { sess.pending = []; break; }
        const next = sess.pending.shift();
        try { apply(sess, next); } catch (err) { console.error(err); }
        // A live scan delivers events seconds apart, so hold findings long enough
        // to read on a projector. A coalesced burst still cascades, just faster,
        // so the lanes fan out instead of appearing as one finished batch.
        const backlog = sess.pending.length;
        let wait = PACE_MS[next.type] || 0;
        if (backlog >= 8) wait = Math.min(wait, 80);
        else if (backlog >= 3) wait = Math.min(wait, 150);
        if (wait && !sess.closed) await new Promise(r => setTimeout(r, wait));
        else await new Promise(r => requestAnimationFrame(r));
      }
    } finally {
      sess.pumping = false;
    }
  })();
}

function parseSSE(raw) {
  const data = [];
  for (const line of raw.split("\n")) {
    if (!line || line.startsWith(":")) continue;
    if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
  }
  if (!data.length) return null;
  try { return JSON.parse(data.join("\n")); } catch { return null; }
}

async function readSSE(body, onEvent) {
  const reader = body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    buf = buf.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    let sep;
    while ((sep = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, sep);
      buf = buf.slice(sep + 2);
      const ev = parseSSE(raw);
      if (ev) onEvent(ev);
    }
  }
}

function requestStop() {
  const runId = session && session.runId;
  if (runId) {
    api("/scan/stop", { method: "POST", body: JSON.stringify({ run_id: runId }) })
      .then(refreshAudit).catch(() => {});
  }
  if (session) session.closed = true;
  if (activeScan) activeScan.abort();
}

async function stopAll() {
  try {
    await api("/scan/stop", { method: "POST", body: JSON.stringify({ all: true }) });
  } catch {}
  if (session) {
    session.closed = true;
    session.stopAll = true;
  }
  if (activeScan) activeScan.abort();
  setLive("STOPPED", "bad");
  setHero("STOPPED", "All scans stopped", "Every in-flight scan halts on its next request.", "bad");
  refreshAudit();
}

function startAudit() {
  $("stopAll").classList.remove("hidden");
  $("limits").classList.remove("hidden");
  refreshAudit();
  if (auditTimer) clearInterval(auditTimer);
  auditTimer = setInterval(refreshAudit, 1000);
}

function stopAudit() {
  if (auditTimer) clearInterval(auditTimer);
  auditTimer = null;
  $("stopAll").classList.add("hidden");
  $("limits").classList.add("hidden");
  $("limits").textContent = "";
}

async function refreshAudit() {
  if (!store.token) return;
  try {
    const res = await api("/audit?limit=30");
    if (!res.ok) return;
    const data = await res.json();
    paintLimits(data.limits);
    paintActivity(data.records || []);
  } catch {}
}

function paintLimits(limits) {
  const el = $("limits");
  if (!el || !limits) return;
  const active = limits.active ?? 0;
  const cap = limits.max_concurrent ?? 0;
  const pace = limits.request_interval_ms ?? 0;
  el.textContent = "cap " + active + "/" + cap + " · " + pace + "ms between requests";
}

function paintActivity(records) {
  const list = $("activityList");
  if (!list) return;
  list.replaceChildren();
  if (!records.length) {
    const empty = document.createElement("div");
    empty.className = "muted";
    empty.textContent = "No scans yet.";
    list.appendChild(empty);
    return;
  }
  for (const row of records) {
    const item = document.createElement("div");
    item.className = "act";
    const time = document.createElement("time");
    time.textContent = fmtTime(row.ts);
    const who = document.createElement("div");
    who.className = "who";
    if (row.kind === "request") {
      who.textContent = (row.agent || row.actor || "agent") + " · " + (row.action || "GET");
    } else {
      who.textContent = (row.actor || "scan") + " · " + (row.status || "scan");
      if (row.detail) who.textContent += " · " + row.detail;
    }
    const st = document.createElement("span");
    const status = row.status;
    st.textContent = status == null || status === "" ? "" : " " + status;
    const n = Number(status);
    if (row.kind === "request") {
      if (n >= 200 && n < 400) st.className = "st-ok";
      else st.className = "st-bad";
    } else if (status === "rejected" || status === "error") st.className = "st-bad";
    else if (status === "cancelled" || status === "stop_requested") st.className = "st-warn";
    else if (status === "complete" || status === "started") st.className = "st-ok";
    who.appendChild(st);
    const url = document.createElement("div");
    url.className = "url";
    url.textContent = row.kind === "request" ? (row.url || "") : (row.target || row.run_id || "");
    item.append(time, who, url);
    list.appendChild(item);
  }
}

function fmtTime(ts) {
  const d = new Date((Number(ts) || 0) * 1000);
  if (!ts || !Number.isFinite(d.getTime())) return "";
  return d.toLocaleTimeString([], { hour12: false });
}

async function scan(url, name) {
  if (session && session.swarm) session.swarm.stop();
  if (activeScan) activeScan.abort();
  const gen = ++scanGen;
  const ctrl = new AbortController();
  activeScan = ctrl;
  stopClock();
  const sess = {
    gen, pending: [], pumping: false, drain: null, closed: false,
    rawCount: 0, heroStreamId: null, lanes: {}, sawTerminal: false,
  };
  session = sess;
  markActive(url);
  const typed = $("targetUrl");
  if (typed) typed.value = url;
  $("result").innerHTML = theaterHTML(name, url);
  paintMock(url, { title: name || hostOf(url) });
  loadPreview(url);
  const stage = $("swarmStage");
  const canvas = $("swarmCanvas");
  if (stage && canvas) {
    sess.swarm = createSwarm(canvas, stage);
    sess.swarm.start();
    stage.scrollIntoView({ behavior: REDUCE_MOTION ? "auto" : "smooth", block: "center" });
  }
  const stopBtn = $("stopBtn");
  if (stopBtn) stopBtn.addEventListener("click", requestStop);
  startClock();
  try {
    const res = await fetch(store.api + "/scan/stream", {
      method: "POST",
      headers: { "Content-Type":"application/json", Authorization: "Bearer " + store.token },
      body: JSON.stringify({ url }),
      signal: ctrl.signal,
    });
    if (sess.closed || gen !== scanGen) return;
    if (res.status === 401) { doLogout(); return; }
    if (!res.ok) {
      let msg = "Scan refused (" + res.status + ")";
      try {
        const d = await res.json();
        if (typeof d.detail === "string") msg = d.detail;
      } catch {}
      setLive("STOPPED", "bad");
      if (res.status === 429) {
        setHero("BUSY", msg, "The concurrency cap is full. Stop a scan or retry.", "bad");
        stageStamp("BUSY");
      } else if (res.status === 403) {
        setHero("BLOCKED", msg, "The allowlist check runs before a scan starts.", "bad");
        stageStamp("BLOCKED");
      } else {
        setHero("BLOCKED", msg, "", "bad");
        stageStamp("BLOCKED");
      }
      refreshAudit();
      return;
    }
    sess.dockTimer = setTimeout(() => {
      if (sess === session && !sess.closed) beginDock(sess);
    }, REDUCE_MOTION ? 0 : 900);
    await readSSE(res.body, (ev) => {
      if (ev && ev.type === "scan_started" && ev.run_id) sess.runId = ev.run_id;
      enqueue(sess, ev);
    });
    if (sess.drain) await sess.drain;
    if (!sess.closed && gen === scanGen && !sess.sawTerminal) {
      setLive("STOPPED", "bad");
      setHero("ERROR", "Stream ended early", "The backend closed before the scan finished.", "bad");
    }
  } catch (e) {
    if (gen !== scanGen) return;
    if (e.name === "AbortError" || sess.closed) {
      setLive("STOPPED", "bad");
      if (sess.stopAll) {
        setHero("STOPPED", "All scans stopped", "Every in-flight scan halts on its next request.", "bad");
      } else {
        setHero("STOPPED", "Scan stopped", "The stream closed. Later phases will not start.", "bad");
      }
      refreshAudit();
      return;
    }
    setLive("STOPPED", "bad");
    setHero("OFFLINE", "Backend unreachable.", store.api, "bad");
  } finally {
    if (gen === scanGen) {
      stopClock();
      if (sess.dockTimer) clearTimeout(sess.dockTimer);
      if (sess.dockBackup) clearTimeout(sess.dockBackup);
      if (sess.swarm) sess.swarm.stop();
      activeScan = null;
      clearActive();
      const btn = $("stopBtn");
      if (btn) btn.disabled = true;
    }
  }
}

async function scanAll() {
  for (const t of (window._targets || [])) await scan(t.url, t.name);
}

function renderResult(name, d, target) {
  const s = d.summary || {}, m = d.machines || {}, fp = d.fingerprint || {};
  const rows = (d.findings || []).map(f => `
    <tr class="${f.verdict === "rejected" ? "rejected" : ""}">
      <td><span class="badge v-${esc(f.verdict)}">${esc(f.verdict)}</span></td>
      <td class="sev sev-${esc(sevOf(f.severity))}">${esc(f.severity)}</td>
      <td>${esc(f.layer)} <span class="src">${f.source === "ai" ? "AI" : "check"}</span></td>
      <td><strong>${esc(f.title)}</strong><div class="evi">${esc(f.evidence)}</div>
          <div class="muted" style="font-size:14px"><em>Fix:</em> ${esc(f.fix)}</div></td>
    </tr>`).join("");
  const html = `
    <h2>Report — ${esc(name)} <span class="muted">(${esc(d.target)})</span></h2>
    <div class="summary">
      <div class="stat"><b>${s.total ?? 0}</b> findings</div>
      <div class="stat" style="color:var(--ok)"><b>${s.confirmed ?? 0}</b> confirmed</div>
      <div class="stat" style="color:var(--warn)"><b>${s.unverified ?? 0}</b> unverified</div>
      <div class="stat" style="color:var(--rej)"><b>${s.rejected ?? 0}</b> rejected</div>
      <div class="stat muted">stack: ${esc(fp.stack)}/${esc(fp.lang)}</div>
      <div class="stat muted">surface: ${d.surface?.pages ?? 0}p · ${d.surface?.forms ?? 0}f · ${d.surface?.params ?? 0}q → ${d.units ?? 0} units</div>
      <div class="stat muted">auth: ${d.auth?.authenticated ? "yes" : "no"}</div>
      <div class="stat muted">model: ${esc(d.model)}</div>
    </div>
    <table>
      <thead><tr><th>verdict</th><th>sev</th><th>layer</th><th>finding</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">No findings.</td></tr>'}</tbody>
    </table>
    <div class="machines">from <strong>${esc(m.requested_from?.name)}</strong> (${esc(m.requested_from?.ip)})
      → scanner <strong>${esc(m.scanner?.name)}</strong>
      → target <strong>${esc(m.target?.name)}</strong> [${esc(m.target?.server_banner)}]</div>`;
  (target || $("result")).innerHTML = html;
}

function doLogout(){
  store.token = null;
  stopAudit();
  if (activeScan) activeScan.abort();
  $("appView").classList.add("hidden");
  $("logout").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("who").textContent = "";
}

function onScanForm(e) {
  e.preventDefault();
  const raw = ($("targetUrl").value || "").trim();
  if (!raw) return;
  const url = /^https?:\/\//i.test(raw) ? raw : "http://" + raw;
  $("targetUrl").value = url;
  scan(url, hostOf(url));
}

$("loginBtn").addEventListener("click", login);
$("logout").addEventListener("click", doLogout);
$("stopAll").addEventListener("click", stopAll);
$("scanAll").addEventListener("click", scanAll);
$("scanForm").addEventListener("submit", onScanForm);
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("api").value = store.api;
if (store.token) enterApp("");
</script>
</body>
</html>
